# Prometheus + Grafana，与本仓库各微服务配合：各服务暴露 /actuator/prometheus
# 用法：在 oj-prometheus 目录执行 docker compose up -d
# 前提：本机已启动网关与各业务服务；Windows/Mac 下用 host.docker.internal 访问宿主机端口

services:
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: oj-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    container_name: oj-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
