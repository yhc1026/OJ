# =============================================================================
# Data ID: common-mybatis.yaml
# Group: DEFAULT_GROUP
# 说明: MyBatis-Plus 公共配置（分页插件在代码 MybatisPlusConfig 中注册）
# =============================================================================
mybatis-plus:
  # 若后续增加 XML，放在 resources/mapper 下可自动扫描
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.bite.system.domain
  configuration:
    # 下划线转驼峰
    map-underscore-to-camel-case: true
    # 开发环境可打开；生产建议改为 slf4j 或关闭
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  # 若表有逻辑删除字段，可在实体上加 @TableLogic，或在此 global-config.db-config 中统一配置
  # global-config:
  #   db-config:
  #     logic-delete-field: deleted
  #     logic-delete-value: 1
  #     logic-not-delete-value: 0
